name: Release

# Manual draft release for a tag. The bundles come from package.yml, so a
# release ships exactly what the packaging workflow builds and size-checks.
# The draft waits for operator review; signing stays a maintainer step
# (docs/release.md §5).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  index:
    name: Published plugin index matches the tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # The app installs only what the signed index lists, so a release whose
      # committed index is not yet served would offer stale recommendations.
      - name: Compare the served index with the tagged one
        shell: bash
        run: |
          set -euo pipefail
          base="https://verithia.github.io/opencompose/plugin-index"
          for file in index.json index.json.sig; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "served-$file" "$base/$file"
            if ! cmp -s "served-$file" "plugin-index/$file"; then
              echo "::error::The served plugin-index/$file differs from ${{ inputs.tag }}. Merge to main and wait for the docs deployment first."
              exit 1
            fi
          done
          echo "plugin index: served copy matches ${{ inputs.tag }}"

  package:
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.tag }}

  draft:
    name: Draft release
    needs: [index, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the bundles
        uses: actions/download-artifact@v4
        with:
          pattern: OpenCompose-*
          path: bundles

      - name: Verify and merge the checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for dir in bundles/*/; do
            (cd "$dir" && sha256sum -c SHA256SUMS.txt)
            cat "$dir/SHA256SUMS.txt" >> dist/SHA256SUMS.txt
            find "$dir" -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec cp {} dist/ \;
          done
          (cd dist && sha256sum -c SHA256SUMS.txt)
          ls -lh dist

      - name: Create the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          See the [release checklist](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/release.md) for details.

          ## Installation
          - **macOS** (Apple silicon and Intel): download the universal \`.dmg\`
          - **Linux**: download the \`.AppImage\` or the \`.deb\`
          - **Windows**: download the \`-setup.exe\` or the \`.msi\`

          Verify a download with \`SHA256SUMS.txt\`.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "OpenCompose $TAG" \
            --notes-file notes.md
