name: Release

# Manual draft-release build. Tag packaging lives in package.yml; this workflow
# only creates a draft for operator review.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-ARM
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macOS-Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/oc-gui/frontend/package-lock.json

      # ── System dependencies ────────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            pkg-config

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Windows build: no extra SoundFont dependency is needed"

      # ── Frontend build ──────────────────────────────────────────────────

      - name: Install frontend dependencies
        working-directory: crates/oc-gui/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: crates/oc-gui/frontend
        run: npx vitest run

      # ── Version gate ───────────────────────────────────────────────────

      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./crates/oc-gui/frontend/package.json').version")"
          if [ "v$version" != "${{ github.event.inputs.tag }}" ]; then
            echo "::error::Tag ${{ github.event.inputs.tag }} does not match package version ${version}."
            exit 1
          fi

      # ── Tauri bundle ────────────────────────────────────────────────────

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/oc-gui/frontend
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "OpenCompose ${{ github.event.inputs.tag }}"
          releaseBody: |
            See the [release checklist](https://github.com/${{ github.repository }}/blob/main/docs/release.md) for details.

            ## Installation
            - **macOS (Apple Silicon)**: Download `.dmg` (aarch64)
            - **macOS (Intel)**: Download `.dmg` (x64)
            - **Linux**: Download `.AppImage` or `.deb`
            - **Windows**: Download `.msi` or `-setup.exe`
          releaseDraft: true
          prerelease: false
          # Shipping configuration: no SoundFont library (docs/release.md §2).
          args: --target ${{ matrix.platform.target }}
