name: Package

# Build the desktop bundles on macOS, Linux and Windows and upload them as
# workflow artifacts. This workflow never creates a release or publishes an
# index; release.yml calls it and publishes the artifacts as a draft.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # linuxdeploy is itself an AppImage; let it unpack on runners without FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal
            os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # A release call names its tag; a tag push is its own tag; any other run
      # builds the selected branch without a version gate.
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Add the build targets
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/oc-gui/frontend/package-lock.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file \
            pkg-config

      - name: Verify the tag matches the package version
        if: env.RELEASE_TAG != ''
        shell: bash
        working-directory: crates/oc-gui/frontend
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${version}."
            exit 1
          fi

      - name: Use clang++ for the universal C++ barrier
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: crates/oc-gui/frontend
        run: npm ci

      - name: Build the bundle
        working-directory: crates/oc-gui/frontend
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Check the packaged Intel plugin helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          helper="target/${{ matrix.target }}/release/bundle/macos/OpenCompose.app/Contents/MacOS/opencompose-vst2-bridge-x86_64"
          test -x "$helper"
          test "$(lipo -archs "$helper")" = "x86_64"

      - name: Check the bundle size budgets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="target/${{ matrix.target }}/release/bundle"
          # Compressed downloads and installers get 100 MiB. The universal
          # .app carries two architectures and the AppImage carries its own
          # GTK and WebKit, so they get 150 MiB.
          downloads=(
            "$bundle"/dmg/*.dmg
            "$bundle"/deb/*.deb
            "$bundle"/msi/*.msi
            "$bundle"/nsis/*.exe
          )
          self_contained=(
            "$bundle"/macos/*.app
            "$bundle"/appimage/*.AppImage
          )
          if [ "${#downloads[@]}" -eq 0 ]; then
            echo "::error::No downloadable bundle found under $bundle."
            exit 1
          fi
          status=0
          scripts/check-bundle-size.sh --limit-mib 100 "${downloads[@]}" || status=1
          if [ "${#self_contained[@]}" -gt 0 ]; then
            scripts/check-bundle-size.sh --limit-mib 150 "${self_contained[@]}" || status=1
          fi
          exit "$status"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p artifacts
          find "$bundle" -maxdepth 4 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          cd artifacts
          test -n "$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          ls -lh

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: OpenCompose-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
