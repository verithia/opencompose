[package]
repository.workspace = true
name = "oc-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["device"]
device = [
    "dep:cpal",
    "dep:core-foundation",
    "dep:core-foundation-sys",
    "dep:coreaudio-sys",
    "dep:windows",
]

[dependencies]
oc-audio-types = { path = "../oc-audio-types" }
oc-dsl = { path = "../oc-dsl" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
hound = "3"
libc = "0.2"
tempfile.workspace = true
cpal = { version = "0.15", features = [], optional = true }

[dev-dependencies]
oc-test-support = { path = "../oc-test-support" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }
coreaudio-sys = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
