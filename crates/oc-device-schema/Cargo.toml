[package]
repository.workspace = true
name = "oc-device-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The language components stay permissive so editors and other tools can
# read `.ocp` projects; see README.md.
license = "MIT OR Apache-2.0"
