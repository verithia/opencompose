[package]
repository.workspace = true
autotests = false
name = "oc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenCompose command-line tool for parsing, validating, and rendering"

[lib]
name = "oc_cli"
path = "src/lib.rs"

[[bin]]
name = "ocp"
path = "src/main.rs"

[features]
# MP3 export ships by default; `--no-default-features` builds the variant that
# names the format and refuses it.
default = ["mp3"]
# MP3 (MPEG Layer III) export, forwarded to the engine encoder.
mp3 = ["oc-engine/mp3"]
# Compile in the debug call sites; --debug decides whether they fire.
debug-log = ["oc-diag/debug-log", "oc-engine/debug-log", "oc-host/debug-log"]
# Compile in the perf counters; --perf decides whether they are collected.
perf-log = ["oc-diag/perf-log", "oc-engine/perf-log", "oc-host/perf-log"]

[dependencies]
oc-device-schema = { path = "../oc-device-schema" }
oc-audio = { path = "../oc-audio" }
oc-build-parity = { path = "../oc-build-parity" }
oc-diag = { path = "../oc-diag" }
oc-dsl = { path = "../oc-dsl" }
oc-dsp = { path = "../oc-dsp" }
oc-engine = { path = "../oc-engine", default-features = false, features = ["plugin-host"] }
oc-host = { path = "../oc-host" }
oc-sample = { path = "../oc-sample" }
oc-synth = { path = "../oc-synth" }
oc-data = { path = "../oc-data", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
rayon = "1"
zstd.workspace = true
sha2.workspace = true
ring.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
oc-market = { path = "../oc-market" }

[dev-dependencies]
oc-test-support = { path = "../oc-test-support" }
oc-market = { path = "../oc-market", features = ["loopback"] }
flate2.workspace = true
oc-sample = { path = "../oc-sample", features = ["test-providers"] }
hound = "3"
claxon = "0.4"          # FLAC decoding, to check what the encoder wrote
midly = "0.5"
serde_json.workspace = true
# The in-process VST3 fakes (test-support) give the CLI an instrument-shaped
# insert without instantiating a commercial plugin.
oc-engine = { path = "../oc-engine", features = ["test-support", "perf-log"] }

[[test]]
name = "all"
path = "tests/all.rs"
