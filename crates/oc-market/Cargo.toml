[package]
repository.workspace = true
name = "oc-market"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared plugin-catalog resolution, verification, and bundle installation"

[lib]
name = "oc_market"
path = "src/lib.rs"

[features]
# The loopback fixture server is test tooling; dependents enable it from their
# dev-dependencies so production builds do not ship an HTTP server.
loopback = []

[dependencies]
tempfile.workspace = true
flate2.workspace = true
ring.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
zstd.workspace = true
chrono.workspace = true
semver.workspace = true
fs4.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
